<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const t = localStorage.getItem('geo-theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      if (t === 'dark') document.documentElement.classList.add('dark-theme');
    } catch (e) { document.documentElement.classList.add('dark-theme'); }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <h1>IP Tracker</h1>
    </div>
    <form id="search-form" class="search" role="search" novalidate>
      <label for="search-input" class="sr-only">Adresa IP sau domeniu</label>
      <input id="search-input" type="text" placeholder="Cauta o adresa IP sau un domeniu, de exemplu 8.8.8.8 sau github.com"
             autocomplete="off" spellcheck="false">
      <button type="submit">Cauta</button>
    </form>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Comuta intre tema intunecata si cea luminoasa" aria-pressed="false">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
    </button>
  </header>

  <div id="error" class="error" role="alert" hidden></div>

  <main id="dashboard" class="grid">
    <!--  R: card detalii (inceput)  --><section class="card details" aria-labelledby="details-title">
  <h2 id="details-title">Detalii retea</h2>
  <dl>
    <div><dt>Adresa IP</dt><dd id="d-ip">0.0.0.0</dd></div>
    <div><dt>Locatie</dt><dd id="d-location">Oras, Regiune, Tara</dd></div>
    <div><dt>Fus orar</dt><dd><span id="d-timezone">Continent/Oras</span><br><span id="d-time" class="muted">00:00:00</span></dd></div>
    <div><dt>ISP</dt><dd id="d-isp">Furnizor de internet</dd></div>
  </dl>
</section>
    <!--  R: card detalii (sfarsit)  -->

    <!--  R: harta (inceput)  -->
      <section class="map-wrap" aria-label="Harta">
  <div id="map"></div>
  <div class="spinner" aria-hidden="true"></div>
</section>
    <!--  R: harta (sfarsit)  -->

    <!--  D: istoric (inceput)  -->
    <section class="card history" aria-labelledby="history-title">
      <div class="history-head">
        <h2 id="history-title">Cautari recente</h2>
        <button id="history-clear" class="link-btn" type="button">Sterge tot</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </section>
    <!--  D: istoric (sfarsit)  -->
  </main>

  <!-- R: scriptul leaflet.js se adauga aici -->
   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="main.js"></script>
</body>
</html>
